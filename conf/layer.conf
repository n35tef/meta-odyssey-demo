# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-odyssey-demo"
BBFILE_PATTERN_meta-odyssey-demo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-odyssey-demo = "8"

# Optional add-on: the Waveshare SPI display/touch HAT + the LVGL
# dashboard kiosk demo. Needs meta-st-odyssey (the board itself) present
# too - this layer only adds the HAT on top of a board that already boots.
LAYERDEPENDS_meta-odyssey-demo = "core meta-st-odyssey"
LAYERSERIES_COMPAT_meta-odyssey-demo = "scarthgap"
